{% extends "base.html" %}
{% block titulo_pagina %}Login | Sistema de Notas{% endblock %}
{% block conteudo %}
<div class="row justify-content-center align-items-center" style="min-height:75vh">
  <div class="col-12 col-sm-9 col-md-6 col-lg-4">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h3 text-center mb-2">Sistema de Notas</h1>
      <p class="text-secondary text-center mb-4">Entre com seu usuário e senha.</p>
      {% if form.errors %}<div class="alert alert-danger">Usuário ou senha inválidos. Tente novamente.</div>{% endif %}
      <form method="post">{% csrf_token %}
        <div class="mb-3"><label for="id_username" class="form-label">Usuário</label><input type="text" name="username" id="id_username" class="form-control" autocomplete="username" required autofocus></div>
        <div class="mb-3"><label for="id_password" class="form-label">Senha</label><input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required></div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
